name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 is the floor the library and CLI support. It is past EOL, so it
          # is only available on the older runner image.
          - python: "3.8"
            runner: ubuntu-22.04
            mcp: false
          - python: "3.10"
            runner: ubuntu-latest
            mcp: true
          - python: "3.11"
            runner: ubuntu-latest
            mcp: true
          - python: "3.12"
            runner: ubuntu-latest
            mcp: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (library, symmetry extra, tests)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[symmetry,test]"

      - name: Show the versions actually under test
        run: |
          python -c "import sys, gemmi, spglib, cifaudit; \
            print('python', sys.version.split()[0]); \
            print('gemmi', gemmi.__version__, 'spglib', spglib.__version__); \
            print('cifaudit', cifaudit.__version__)"

      - name: Tests
        run: pytest -q

      - name: CLI smoke (clean file exits 0, a defect exits 1)
        run: |
          cifaudit tests/data/clean.cif
          if cifaudit tests/data/npd.cif; then
            echo "expected a non-zero exit for npd.cif"; exit 1
          fi
          # --json must be valid JSON and carry the finding. --fail-on never,
          # because npd.cif has an error and would otherwise exit 1 here.
          cifaudit tests/data/npd.cif --json --fail-on never \
            | python -c "import json,sys; d=json.load(sys.stdin); \
                assert any(f['code']=='ADP_NPD' for f in d['findings']), d; \
                print('json OK')"
          cifaudit tests/data/multiblock.cif --list-datablocks

      # The MCP server needs >= 3.10. This is the check that matters most:
      # cifaudit once shipped a server written against mcp 1.x's FastMCP after
      # 2.0 renamed it to MCPServer, and only a real invocation caught it. A
      # stub SDK cannot, because it provides whatever the code imports.
      - name: Install the real MCP SDK
        if: matrix.mcp
        run: pip install --only-binary cryptography -e ".[mcp]"

      - name: MCP server end-to-end over stdio
        if: matrix.mcp
        run: python scripts/mcp_smoke.py "$(which cifaudit-mcp)" tests/data
